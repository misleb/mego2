services:
  postgres:
    image: postgres:16-alpine
    container_name: mego2-postgres
    environment:
      POSTGRES_USER: mego2
      POSTGRES_PASSWORD: mego2_dev
      POSTGRES_DB: mego2_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mego2"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
